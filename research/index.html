<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIStraLab - Research</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/inner-pages.css?v=2">
    <style>
        .research-wrap {
            color: #111827;
            line-height: 1.6;
        }
        .research-intro {
            margin: 0 0 24px 0;
            color: #334155;
            border-bottom: 1px solid #cbd5e1;
            padding-bottom: 16px;
            text-align: justify;
        }
        .research-block {
            padding: 12px 0 14px 0;
        }
        .research-block h2 {
            margin: 0 0 6px 0;
            font-size: 1.25rem;
            color: #0f172a;
        }
        .funded-projects-block {
            border-top: 2px solid #d6dee8;
            margin-top: 14px;
            padding-top: 18px;
        }
        .funded-projects-block h2 {
            font-size: 1.55rem;
            color: #002244;
        }
        .research-block p {
            margin: 0;
            color: #1f2937;
            text-align: justify;
        }
        .project-table-wrap {
            margin-top: 10px;
            overflow-x: auto;
        }
        .project-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 0.95rem;
            color: #333;
        }
        .project-table thead {
            background-color: #f8fafc;
            border-bottom: 2px solid #eef2f7;
        }
        .project-table th,
        .project-table td {
            text-align: left;
            padding: 12px 15px;
            border-bottom: 1px solid #eee;
            vertical-align: top;
        }
        .project-table th {
            color: #002244;
            font-weight: bold;
        }
        .project-table tbody tr:hover {
            background-color: #f9f9f9;
        }
        .project-table a {
            text-decoration: none;
            color: #002244;
            font-weight: 600;
        }
        .project-table a:hover {
            text-decoration: underline;
            color: #0056b3;
        }
        .positions-cta {
            margin: 14px 0 24px 0;
            padding: 16px 18px;
            border: 2px solid #cfe0f6;
            background: #f3f8ff;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
        }
        .positions-cta p {
            margin: 0;
            color: #0f172a;
            font-size: 1.05rem;
            line-height: 1.5;
        }
        .positions-cta a {
            display: inline-block;
            padding: 8px 14px;
            border-radius: 6px;
            background: #002244;
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            white-space: nowrap;
        }
        .positions-cta a:hover {
            background: #0056b3;
        }
        @media (max-width: 700px) {
            .positions-cta {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    
    <!-- Navbar -->
    <div id="navbar-placeholder"></div>

    <main class="inner-page research-wrap">
        <h2 class="page-title">Research</h2>
        <div id="research-content"></div>
    </main>
        <!-- You can add more research areas here in the same format -->

    <!-- Footer -->
    <div id="footer-placeholder"></div>

  <!-- Load Navbar and Footer -->
  <script>
    fetch("/partials/navbar.html")
      .then((response) => response.text())
      .then((data) => {
        document.getElementById("navbar-placeholder").innerHTML = data;

        const toggle = document.getElementById("hamburger-toggle");
        const links = document.getElementById("nav-links");

        if (toggle && links) {
          let isOpen = false;

          toggle.addEventListener("click", () => {
            if (!isOpen) {
              links.classList.add("active");
              isOpen = true;
            } else {
              links.classList.add("closing");
              links.classList.remove("active");
              setTimeout(() => {
                links.classList.remove("closing");
                isOpen = false;
              }, 400);
            }
          });
        }
      });

    fetch("/partials/footer.html")
      .then((response) => response.text())
      .then((data) => {
        document.getElementById("footer-placeholder").innerHTML = data;
      });
  </script>
  <script type="module" src="/research/js/research-content.js"></script>
</body>
</html>
