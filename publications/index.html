<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MIStraLab - Publications</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css"/>
  <link rel="stylesheet" href="/css/inner-pages.css?v=2"/>
  <style>
    :root {
      --ink: #002244;
      --ink-weak: #555;
      --accent: #0056b3;
      --bg-soft: #f8f9fa;
      --border-color: #dee2e6;
    }

    .filter-controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border-color);
    }

    .filter-controls label {
      font-weight: 600;
      color: #1f2937;
    }

    .filter-controls select {
      padding: 10px 15px;
      font-size: 16px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      background-color: #fff;
    }

    ul.publications-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: grid;
      gap: 14px;
    }

    .publication-item {
      display: block;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      background: #fcfcfd;
      padding: 16px 18px;
    }

    .publication-content {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .publication-authors {
      color: var(--ink-weak);
      line-height: 1.5;
      font-size: 0.95rem;
    }

    .publication-title {
      font-size: 1.08rem;
      font-weight: 600;
      color: var(--accent);
      text-decoration: none;
      line-height: 1.45;
    }

    .publication-title:hover {
      text-decoration: underline;
    }

    .publication-venue {
      font-style: italic;
      color: var(--ink);
      line-height: 1.4;
    }

    .action-buttons {
      display: flex;
      gap: 8px;
      margin-top: 6px;
    }

    .action-buttons a {
      font-size: 0.8rem;
      padding: 6px 12px;
      color: #002244;
      background-color: #fff;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      text-decoration: none;
      transition: all 0.15s ease;
    }

    .action-buttons a:hover {
      background-color: #eef4ff;
      border-color: #9db4d1;
      color: #002244;
    }

    #loader {
      text-align: center;
      font-size: 18px;
      color: #555;
      padding: 40px;
    }

    .publication-item.hidden {
      display: none;
    }

    @media (max-width: 600px) {
      h2 {
        font-size: 28px;
      }
      .filter-controls {
        flex-direction: column;
        align-items: stretch;
      }
    }
  </style>
</head>
<body>

  <div id="navbar-placeholder"></div>

  <div class="inner-page">
    <h2 class="page-title">Publications</h2>

    <div class="filter-controls">
      <label for="yearFilter">Year:</label>
      <select id="yearFilter" onchange="filterPublications()">
        <option value="all">All</option>
      </select>
    </div>

    <div id="publications-container">
      <div id="loader">Loading publications... This may take a moment.</div>
      <ul class="publications-list"></ul>
    </div>

  </div>

  <div id="footer-placeholder"></div>

  <script>
    function filterPublications() {
      const selectedYear = document.getElementById("yearFilter").value;
      const publicationItems = document.querySelectorAll(".publication-item");

      publicationItems.forEach(item => {
        const itemYear = item.getAttribute("data-year");
        if (selectedYear === "all" || selectedYear === itemYear) {
          item.classList.remove("hidden");
        } else {
          item.classList.add("hidden");
        }
      });
    }

    async function fetchAndDisplayPublications() {
      const orcidId = "0000-0001-5156-5448";
      const piName = "Sargin, I.";
      const publicationsList = document.querySelector('.publications-list');
      const yearFilter = document.getElementById('yearFilter');
      const loader = document.getElementById('loader');

      try {
        const summaryUrl = `https://pub.orcid.org/v3.0/${orcidId}/works`;
        const summaryResponse = await fetch(summaryUrl, { headers: { 'Accept': 'application/json' } });
        if (!summaryResponse.ok) throw new Error(`HTTP error! Status: ${summaryResponse.status}`);

        const summaryData = await summaryResponse.json();
        const workSummaries = summaryData.group.map(work => work['work-summary'][0]);

        const detailPromises = workSummaries.map(summary => {
          const putCode = summary['put-code'];
          const detailUrl = `https://pub.orcid.org/v3.0/${orcidId}/work/${putCode}`;
          return fetch(detailUrl, { headers: { 'Accept': 'application/json' } }).then(res => res.json());
        });

        const fullDetails = await Promise.all(detailPromises);

        fullDetails.sort((a, b) => {
          const yearA = a['publication-date']?.year?.value || 0;
          const yearB = b['publication-date']?.year?.value || 0;
          return yearB - yearA;
        });

        const uniqueYears = new Set();
        let allPublicationsHTML = '';

        fullDetails.forEach(detail => {
          const year = detail['publication-date']?.year?.value;
          const title = detail.title?.title?.value;
          const journal = detail['journal-title']?.value || '';

          if (year) {
            uniqueYears.add(year);
          }

          let authors = 'N/A';
          if (detail.contributors?.contributor) {
            const contributorNames = detail.contributors.contributor.map(c => c['credit-name']?.value).filter(Boolean);
            authors = contributorNames.join(', ');
            if (piName) {
              authors = authors.replace(piName, `<strong>${piName}</strong>`);
            }
          }

          let doiLink = '#';
          const externalIds = detail['external-ids']?.['external-id'];
          if (externalIds) {
            const doiObject = externalIds.find(id => id['external-id-type'] === 'doi');
            if (doiObject) {
              doiLink = `https://doi.org/${doiObject['external-id-value']}`;
            }
          }

          if (year && title) {
            allPublicationsHTML += `
              <li class="publication-item" data-year="${year}">
                <div class="publication-content">
                  <div class="publication-authors">${authors}</div>
                  <a href="${doiLink}" target="_blank" class="publication-title">${title} (${year})</a>
                  <div class="publication-venue">${journal}</div>
                  <div class="action-buttons">
                    <a href="${doiLink}" target="_blank" class="btn-doi">Open DOI</a>
                  </div>
                </div>
              </li>`;
          }
        });

        loader.style.display = 'none';
        publicationsList.innerHTML = allPublicationsHTML;

        Array.from(uniqueYears).sort((a, b) => b - a).forEach(year => {
          const option = document.createElement('option');
          option.value = year;
          option.textContent = year;
          yearFilter.appendChild(option);
        });

      } catch (error) {
        loader.textContent = 'Failed to load publications. Please try again later.';
        console.error('Error fetching ORCID data:', error);
      }
    }

    document.addEventListener('DOMContentLoaded', fetchAndDisplayPublications);
  </script>

  <script>
    fetch('/partials/navbar.html')
      .then((response) => response.text())
      .then((data) => {
        document.getElementById('navbar-placeholder').innerHTML = data;
        const toggle = document.getElementById('hamburger-toggle');
        const links = document.getElementById('nav-links');
        if (toggle && links) {
          let isOpen = false;
          toggle.addEventListener('click', () => {
            if (!isOpen) {
              links.classList.add('active');
              isOpen = true;
            } else {
              links.classList.add('closing');
              links.classList.remove('active');
              setTimeout(() => {
                links.classList.remove('closing');
                isOpen = false;
              }, 400);
            }
          });
        }
      });

    fetch('/partials/footer.html')
      .then((response) => response.text())
      .then((data) => {
        document.getElementById('footer-placeholder').innerHTML = data;
      });
  </script>

</body>
</html>
